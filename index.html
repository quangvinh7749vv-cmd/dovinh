<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Sinh Nhật ĐO VINH - 16/5 🎂</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&display=swap');
    
    body {
      margin: 0; padding: 0; height: 100vh;
      background: linear-gradient(135deg, #ff006e, #fb5607, #ffbe0b, #8338ec);
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    h1 { font-size: 3.2rem; margin: 10px 0; text-shadow: 0 0 25px rgba(0,0,0,0.5); }
    .name { font-size: 4.8rem; margin: 10px 0; animation: glow 2s infinite alternate; }
    .teaser { font-size: 2.3rem; margin: 30px 0; }
    .origin { font-size: 1.5rem; opacity: 0.95; margin-top: 10px; }
    button {
      margin-top: 30px; padding: 18px 50px; font-size: 1.5rem;
      background: white; color: #ff006e; border: none; border-radius: 50px;
      font-weight: bold; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    @keyframes glow { 
      from { text-shadow: 0 0 20px #fff; } 
      to { text-shadow: 0 0 50px #fff, 0 0 70px #ffbe0b; } 
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="teaser">
      <h1>❤️ Hôm nay có chuyện lớn lắm...</h1>
      <p class="teaser">Bấm mạnh vào đi bro</p>
    </div>

    <div id="reveal" style="display: none;">
      <h1>🎉🎂🎉</h1>
      <h1>HÔM NAY LÀ</h1>
      <h1 style="font-size: 4.5rem;">SINH NHẬT</h1>
      <h1 class="name">quang vinh 🥳</h1>
      <p class="origin">nghĩa dũng - Cẩm Phong - Cẩm Thủy, Thanh Hóa</p>
      <p style="font-size: 2.2rem; margin: 15px 0;">16 / 5 / 2026</p>
      <p style="font-size: 1.7rem;">Cảm ơn vì đã đồng hành cùng tao từ Cẩm Phang ra thế giới này ❤️</p>
      <button onclick="window.location.reload()">Chơi lại từ đầu</button>
    </div>
  </div>

  <canvas id="confetti" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

  <audio id="music" loop>
    <source src="https://assets.mixkit.co/sfx/preview/2967/2967.wav" type="audio/wav">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const music = document.getElementById('music');
    music.volume = 0.65;
    music.play().catch(() => {});

    function launchConfetti() {
      confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
    }

    setInterval(launchConfetti, 700);

    document.body.addEventListener('click', () => {
      document.getElementById('teaser').style.display = 'none';
      document.getElementById('reveal').style.display = 'block';
      for(let i = 0; i < 8; i++) {
        setTimeout(launchConfetti, i * 150);
      }
    });
  </script>
</body>
</html>
